name: Link the unpublished Qeet ID packages
description: >
  Until @qeet-id/node and @qeet-id/react are on npm, builds them from their
  repositories and registers them with `bun link`, which the `link:`
  devDependencies in package.json resolve to. Delete this action, and its
  uses, once both are published.

inputs:
  node-ref:
    description: The qeet-id-node branch or tag to build
    default: develop
  react-ref:
    description: The qeet-id-react branch or tag to build (the one with the session contract)
    default: feat/sdk-1.0

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        repository: qeetgroup/qeet-id-node
        ref: ${{ inputs.node-ref }}
        path: .deps/qeet-id-node

    - uses: actions/checkout@v7
      with:
        repository: qeetgroup/qeet-id-react
        ref: ${{ inputs.react-ref }}
        path: .deps/qeet-id-react

    - name: Build and link them
      shell: bash
      run: |
        for dir in .deps/qeet-id-node .deps/qeet-id-react; do
          (cd "$dir" && bun install --frozen-lockfile && bun run build && bun link)
        done
