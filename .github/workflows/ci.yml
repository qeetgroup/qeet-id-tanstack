name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported Node.js line (package.json requires >=22.12). The tests
        # run on Node, not bun: Node is what TanStack Start apps run on.
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # Until @qeet-id/node and @qeet-id/react are on npm (see AGENTS.md).
      - uses: ./.github/actions/link-qeet-id-packages

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test:coverage
      # The published package's exports and types.
      - run: bun run check:package
