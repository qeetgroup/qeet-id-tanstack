name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Until @qeet-id/node and @qeet-id/react are on npm (see AGENTS.md).
      - uses: ./.github/actions/link-qeet-id-packages

      - run: bun install --frozen-lockfile

      # Lint and formatting in one pass (biome.json).
      - run: bun run check
