name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    # Code scanning is free on public repositories only; a private one would need a
    # paid licence, so the job waits until the repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
